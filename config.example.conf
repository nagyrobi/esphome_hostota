# Example configuration for the ESPHome host OTA server
# Lines starting with '#' are comments.

# UDP port to listen on for OTA invitations (default 3232 for ESPHome/Arduino OTA)
ota_port=3232

# Optional OTA password. Leave empty for no authentication.
#ota_password=supersecret

# Bind address (0.0.0.0 listens on all interfaces)
bind_address=0.0.0.0

# Where the currently active binary should live. The server will replace this file or write inside the
# directory when running_filename is set.
running_path=/opt/esphome_hostota/bin/host_firmware

# Optional: filename for the binary when running_path is a directory. Use this to override the filename
# reported by OTA. Leave empty to use the name from the OTA upload.
#running_filename=host_firmware

# Where old binaries are stored with bak_ timestamps
backup_path=/opt/esphome_hostota/backups

# Temporary directory for incoming binaries
temp_path=/opt/esphome_hostota/tmp

# How many backups to keep
backup_keep=10

# Whether to daemonize after startup (true/false)
run_in_background=false

# Exit the OTA server after launching the new binary (true/false)
exit_after_exec=false

# Watchdog interval in seconds. Set to 0 or negative to disable the watchdog.
watchdog_interval_seconds=30

# Path for the log file. It will be created if missing.
log_path=/var/log/esphome_hostota.log
